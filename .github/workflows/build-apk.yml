name: Build Debug APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          gomobile init

      - name: Build libv2ray.aar from source
        run: |
          cd AndroidLibXrayLite
          mkdir -p assets data
          bash gen_assets.sh download || true
          cp -v data/*.dat assets/ || true
          go mod tidy
          gomobile bind -v -androidapi 24 -trimpath -ldflags='-s -w -buildid=' -o libv2ray.aar ./
          mkdir -p ../V2rayNG/app/libs
          cp libv2ray.aar ../V2rayNG/app/libs/
          echo "✅ libv2ray.aar successfully built and copied"

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c

      - name: Build hev-socks5-tunnel
        run: |
          chmod +x compile-hevtun.sh
          export NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}
          bash compile-hevtun.sh
          mkdir -p V2rayNG/app/libs
          cp -r libs/* V2rayNG/app/libs/ || true
          echo "✅ hev-socks5-tunnel compiled and copied"

      - name: Grant execute permission for gradlew
        run: chmod +x V2rayNG/gradlew

      - name: Build F-Droid Debug APK
        run: cd V2rayNG && ./gradlew assembleFdroidDebug

      - name: Find APK file
        run: |
          echo "Searching for APK files..."
          find V2rayNG/app/build/outputs -name "*.apk" -type f
          echo "APK_PATH=$(find V2rayNG/app/build/outputs -name "*.apk" -type f | head -1)" >> $GITHUB_ENV

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: olcng-fdroid-debug-apk
          path: ${{ env.APK_PATH }}
