name: Build Debug APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download pre-compiled libv2ray.aar
        run: |
          mkdir -p V2rayNG/app/libs
          curl -L -o V2rayNG/app/libs/libv2ray.aar https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar
          echo "✅ libv2ray.aar successfully downloaded"

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c

      - name: Build hev-socks5-tunnel
        run: |
          chmod +x compile-hevtun.sh
          export NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}
          bash compile-hevtun.sh
          mkdir -p V2rayNG/app/libs
          cp -r libs/* V2rayNG/app/libs/ || true
          echo "✅ hev-socks5-tunnel compiled and copied"

      - name: Grant execute permission for gradlew
        run: chmod +x V2rayNG/gradlew

      - name: Build F-Droid Debug APK
        run: cd V2rayNG && ./gradlew assembleFdroidDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: olcng-fdroid-debug-apk
          path: V2rayNG/app/build/outputs/apk/fdroid/debug/app-fdroid-debug.apk
